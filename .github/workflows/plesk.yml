name: Build para Plesk

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    environment: github-pages
    env:
      SITE_URL: https://esn-santiago.org
      BASE_PATH: /
      PUBLIC_BOOKING_URL: ${{ vars.PUBLIC_BOOKING_URL || secrets.PUBLIC_BOOKING_URL }}
      PUBLIC_RSVP_COUNT_URL: ${{ vars.PUBLIC_RSVP_COUNT_URL || secrets.PUBLIC_RSVP_COUNT_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Verificar build
        run: test -f dist/index.html
      - name: Publicar dist/ en la rama plesk
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: plesk
          folder: dist
          clean: true
